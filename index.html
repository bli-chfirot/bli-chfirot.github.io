<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מדריכים מהפרקים</title>
<meta name="description" content="המדריכים מהסרטונים על Claude: כל מה שהבטחנו בתגובות, במקום אחד.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Karantina:wght@700&display=swap">
<style>
:root { --night: #0a1424; --panel: #10223a; --line: #22385a; --fg: #edf2f9; --muted: #9db0c8; --amber: #ffbf57;
  --display: "Karantina", "Assistant", "Arial Hebrew", sans-serif; --body: "Assistant", "Arial Hebrew", sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--night); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.6; }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 40px; display: grid; gap: 18px; }
h1 { font-family: var(--display); font-size: clamp(44px, 12vw, 60px); line-height: 0.95; margin: 0; }
p { margin: 0; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a.ep { display: grid; gap: 2px; text-decoration: none; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
a.ep b { font-size: 19px; } a.ep span { color: var(--muted); font-size: 15px; }
a.ep:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.kw { color: var(--amber); font-weight: 700; }
footer { color: var(--muted); font-size: 13.5px; text-align: center; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>מדריכים מהפרקים</h1>
  <p>כל מה ששלחנו למי שהגיב בסרטונים, במקום אחד. החדש ביותר למעלה.</p>
  <ul>
    <li><a class="ep" href="e/ep07-goal/"><b>מדריך הגול</b><span>איך /goal עובד, מה יש בגול טוב, ו-10 גולים מוכנים להעתקה · מילת הקוד <span class="kw">גול</span></span></a></li>
  </ul>
  <footer>עמוד לא רשמי, לא קשור ל-Anthropic.</footer>
</main>
</body>
</html>
